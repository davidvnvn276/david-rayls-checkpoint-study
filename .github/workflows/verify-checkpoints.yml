name: Reproduce checkpoint study

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - name: Check distribution file identity
        run: python -B verify_study.py --integrity-only
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Reproduce all saved observations and controls
        run: python -B verify_study.py --output runs/ci
      - name: Retain fresh reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkpoint-reproduction-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/ci/review-summary.json
            runs/ci/logs/
            runs/ci/baseline/audit-summary.json
            runs/ci/baseline/logs/
            runs/ci/followup/*.json
            runs/ci/headers.json
          if-no-files-found: warn
          retention-days: 30
